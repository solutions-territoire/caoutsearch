inherit_from: .rubocop_todo.yml

require:
  - standard
  - standard-custom
  - standard-performance
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake

inherit_gem:
  standard: config/ruby-3.0.yml
  standard-custom: config/base.yml
  standard-performance: config/base.yml

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - '**/tmp/**/*'
    - '**/vendor/**/*'
